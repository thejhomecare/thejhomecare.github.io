            'cases/samgye-office-pj-roll/index.html':[
              ('갈매기 몰딩 구조에서 3면 상하 방식을 적용한 이유는 무엇인가요?','사이드의 계단식 갈매기 몰딩과 장착 공간을 확인한 뒤 이번 현장에는 기존과 같은 3면 구조의 상하 작동 방식으로 주문 제작했습니다.')],
            'cases/yulha-dongwon-louver-screen/index.html':[
              ('이번 실외기실에는 어떤 루버망을 사용했나요?','구멍 나고 노후된 기존 루버망을 실측한 뒤 화이바글라스 루버방충망으로 주문 제작해 교체했습니다.')],
            'cases/yulha-jungang-heights-pj-roll/index.html':[
              ('이번 시스템창의 기존 PJ롤방충망은 왜 탈거가 까다로웠나요?','기존 제품의 고정 방식을 바로 파악하기 어려워 프레임과 창호를 손상시키지 않도록 고정부를 확인하며 탈거했습니다.')],
            'cases/yulha-seohui-starhills-fine-screen/index.html':[
              ('방충망이 뻑뻑하거나 끌리면 롤러 문제인가요?','이번 현장에서는 롤러의 작동 상태가 좋지 않아 망과 모헤어 교체와 함께 롤러도 정비했습니다. 뻑뻑함의 원인은 현장 상태를 함께 확인해야 합니다.')],
          }

          if set(faq_map) != {p.as_posix() for p in detail_files}:
              missing={p.as_posix() for p in detail_files}-set(faq_map)
              extra=set(faq_map)-{p.as_posix() for p in detail_files}
              raise SystemExit(f'faq map mismatch missing={missing} extra={extra}')

          def set_intro(text, intro, rel):
              pat=re.compile(r'(<div class="detail-heading">.*?<h1>.*?</h1>)<p>.*?</p>(</div>)', re.S)
              new,n=pat.subn(lambda m: m.group(1)+f'<p>{intro}</p>'+m.group(2), text, count=1)
              if n!=1:
                  raise SystemExit(f'intro marker failed: {rel}')
              return new

          faq_pat=re.compile(r'<section class="case-faq">.*?</section>', re.S)
          def set_faq(text, items, rel):
              m=faq_pat.search(text)
              if not m:
                  raise SystemExit(f'faq section missing: {rel}')
              if not items:
                  return text[:m.start()]+text[m.end():]
              body='<section class="case-faq"><h2>자주 묻는 질문</h2>'
              for q,a in items:
                  body+=f'<h3>{q}</h3><p>{a}</p>'
              body+='</section>'
              return text[:m.start()]+body+text[m.end():]

          for rel,intro in intro_map.items():
              p=Path(rel); text=p.read_text(encoding='utf-8'); text=set_intro(text,intro,rel); p.write_text(text,encoding='utf-8')

          # N34 content consistency: keep H1, but align meta/summary/body with confirmed mohair work.
          rel='cases/jinyeong-fine-screen/index.html'
          p=Path(rel); text=p.read_text(encoding='utf-8')
          text=text.replace('김해 진영 중흥S클래스리버티3단지에서 미세방충망을 교체한 시공사례입니다. 창 크기와 시공 수량, 기존 방충망 상태를 확인해 상담합니다.','김해 진영 중흥S클래스리버티3단지에서 미세방충망과 모헤어를 함께 교체한 시공사례입니다.')
          text=text.replace('김해 진영 중흥S클래스리버티3단지 미세방충망 교체 현장입니다.','김해 진영 중흥S클래스리버티3단지 미세방충망·모헤어 교체 현장입니다.')
          text=text.replace('<div><dt>작업</dt><dd>방충망 교체</dd></div>','<div><dt>작업</dt><dd>미세방충망·모헤어 교체</dd></div>')
          text=text.replace('미세방충망은 창 크기와 시공 수량을 확인해 견적을 안내합니다.','미세방충망 교체와 함께 모헤어까지 정비한 현장입니다.')
          text=text.replace('중흥S클래스리버티3단지의 창문 방충망을 미세방충망으로 교체했습니다. 작업 전에는 창 크기와 교체 수량을 확인하고 현장 조건에 맞춰 시공합니다.','중흥S클래스리버티3단지의 창문 방충망을 미세방충망으로 교체하고 모헤어도 함께 교체했습니다.')
          text=text.replace('교체를 마친 방충망을 모아 망 상태와 마감을 확인했습니다. 현장에 따라 창 크기와 수량이 다르기 때문에 상담 시 현재 방충망 사진을 함께 보내주시면 확인에 도움이 됩니다.','교체를 마친 방충망과 모헤어 상태, 마감을 함께 확인했습니다.')
          p.write_text(text,encoding='utf-8')

          for rel,items in faq_map.items():
              p=Path(rel); text=p.read_text(encoding='utf-8'); text=set_faq(text,items,rel); p.write_text(text,encoding='utf-8')

          # Verification: H1/SEO titles unchanged; FAQ 0~2 only; no generic consultation FAQ remains.
          total_q=0
          zero_faq=[]
          for p in detail_files:
              rel=p.as_posix(); text=p.read_text(encoding='utf-8')
              mh=re.search(r'<h1>(.*?)</h1>', text, re.S)
              mt=re.search(r'<title>(.*?)</title>', text, re.S)
              if (mh.group(1) if mh else '') != original_h1[rel]:
                  raise SystemExit(f'H1 changed unexpectedly: {rel}')
              if (mt.group(1) if mt else '') != original_title[rel]:
                  raise SystemExit(f'title changed unexpectedly: {rel}')
              faq=faq_pat.search(text)
              qcount=len(re.findall(r'<h3>.*?</h3>', faq.group(0), re.S)) if faq else 0
              if qcount>2:
                  raise SystemExit(f'too many FAQ items: {rel} -> {qcount}')
              total_q+=qcount
              if qcount==0: zero_faq.append(rel)
              for banned in ('견적은 어떻게','사진으로 먼저 상담','기존 방충망 틀은 그대로 사용할 수 있나요?','방충망 교체할 때 모헤어도 같이'):
                  if banned in (faq.group(0) if faq else ''):
                      raise SystemExit(f'generic FAQ remains in {rel}: {banned}')

          n34=Path('cases/jinyeong-fine-screen/index.html').read_text(encoding='utf-8')
          for marker in ('미세방충망과 모헤어를 함께 교체한 시공사례입니다.','미세방충망·모헤어 교체','모헤어도 함께 교체했습니다.'):
              if marker not in n34:
                  raise SystemExit(f'N34 consistency marker missing: {marker}')

          for rel,intro in intro_map.items():
              text=Path(rel).read_text(encoding='utf-8')
              if f'<p>{intro}</p></div>' not in text:
                  raise SystemExit(f'intro verification failed: {rel}')

          print('Phase 2 verified: 36 detail pages, H1/title unchanged')
          print('FAQ total:', total_q, 'zero-FAQ pages:', len(zero_faq))
          print('Zero FAQ:', ', '.join(zero_faq))
          print('Intro compressed pages:', len(intro_map))
          PY
      - name: Commit phase 2 fixes
        shell: bash
        run: |
          git config user.name "thejhomecare"
          git config user.email "thej2homecare@gmail.com"
          git add cases
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Apply phase 2 content cleanup"
          git push